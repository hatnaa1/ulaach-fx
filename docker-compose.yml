services:
  fx-api:
    build: .
    image: ulaach-fx-api:latest
    container_name: fx-api
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8085:8085"
      - "${TAILSCALE_BIND:-100.123.226.4}:8085:8085"
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
    name: caddy_default
