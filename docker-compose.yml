services:
  fx-api:
    build: .
    image: ulaach-fx-api:latest
    container_name: fx-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Ulaanbaatar
    ports:
      - "100.123.226.4:8085:8085"
      - "127.0.0.1:8085:8085"
    networks:
      - web
      - pg-stack_default

networks:
  web:
    external: true
  pg-stack_default:
    external: true
